version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  send_reminder:
    docker:
      - image: cimg/node:20.9.0

    steps:
      - checkout
      - run:
          name: Install deps
          command: yarn install
      - run:
          name: Send reminder to Slack
          command: yarn send-reminder
      - run:
          name: Create RC branch and PR in eigen
          command: yarn create-rc

  test-js:
    docker:
      - image: cimg/node:20.9.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: yarn install
      - run:
          name: Run tests
          command: yarn test

workflows:
  version: 2

  test:
    jobs:
      - test-js

  release_cadence:
    triggers:
      - schedule:
          # TEMP: Friday skipped this cycle (jobs ran Thu 2026-10-01 via
          # release_cadence_oneoff below). Restore to 1,2,3,4,5 after Fri 10:00 UTC.
          cron: "0 10 * * 1,2,3,4" # https://crontab.guru
          filters:
            branches:
              only:
                - main
    jobs:
      - send_reminder

  # TEMP: run Friday's jobs on Thu 2026-10-01 at 14:30 CEST (12:30 UTC).
  # Day-of-month 1 / October so it can't fire on any other Thursday. Remove on Friday.
  release_cadence_oneoff:
    triggers:
      - schedule:
          cron: "30 12 1 10 *"
          filters:
            branches:
              only:
                - main
    jobs:
      - send_reminder
  # # Uncomment the following workflow to trigger the reminder on every push, for debugging.
  # release_cadence_manual:
  #   jobs:
  #     - send_reminder
